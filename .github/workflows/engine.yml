name: engine

on:
  push:
    paths:
      - "skills/_engine/**"
      - "skills/mr-impact-method/**"
      - "skills/**"
      - "tools/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "skills/_engine/**"
      - "skills/mr-impact-method/**"
      - "skills/**"
      - "tools/**"
      - ".github/workflows/engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Quality (engine + skills)
        run: python tools/quality.py
