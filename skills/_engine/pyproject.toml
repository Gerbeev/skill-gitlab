[project]
name = "mr-impact"
version = "0.1.0"
description = "Local repository and runtime impact analysis for Copilot skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mr-impact = "mr_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
